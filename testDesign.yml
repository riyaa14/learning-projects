apiVersion: v1
kind: Namespace
metadata:
    annotations: {}
    labels: {}
    name: default
    namespace: default
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    annotations: {}
    labels: {}
    name: network-policy-wy
    namespace: default
spec:
    ingress:
        - from: []
          ports: []
        - from: []
          ports: []
    selector:
        matchLabels:
            role: db
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    annotations: {}
    labels: {}
    name: network-policy-yn
    namespace: default
---
apiVersion: v1
kind: Pod
metadata:
    annotations: {}
    labels:
        role: db
    name: database
    namespace: default
spec:
    containers:
        - image: redis:6
          name: database
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Pod
metadata:
    annotations: {}
    labels:
        role: frontend
    name: frontend
    namespace: default
spec:
    "00":
        networkPolicy: network-policy-wy
    containers:
        - image: nginx:latest
          name: frontend
          ports:
            - containerPort: 80
